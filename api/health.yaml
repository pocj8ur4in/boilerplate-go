# /health
get:
    operationId: HealthCheck
    summary: health check
    description: check the health of the server and dependencies.
    tags:
        - system
    responses:
        200:
            description: OK
            content:
                application/json:
                    schema:
                        $ref: "./schemas.yaml#/SystemHealthCheckResponse"
        429:
            description: "Too Many Requests: rate limit exceeded"
            content:
                application/json:
                    schema:
                        $ref: "./schemas.yaml#/GenericErrorResponse"
                    example:
                        error: "TOO_MANY_REQUESTS"
                        message: "rate limit exceeded"
        503:
            description: "Service Unavailable: request throttling timeout"
            content:
                application/json:
                    schema:
                        $ref: "./schemas.yaml#/GenericErrorResponse"
                    example:
                        error: "REQUEST_THROTTLING_TIMEOUT"
                        message: "server is too busy"
